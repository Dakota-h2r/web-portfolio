<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive JavaScript Logic Laboratory</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            margin-bottom: 5px;
        }

        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background-color: var(--bg-secondary);
            color: var(--text);
            border: 2px solid transparent;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            border-color: var(--accent);
            background-color: #0c4a6e;
        }

        .game-container {
            background-color: var(--bg-secondary);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            align-items: center;
            min-width: 320px;
        }

        .game-container.active {
            display: flex;
        }

        /* Snake Styles */
        #snakeCanvas {
            background-color: #020617;
            border: 2px solid #475569;
            border-radius: 4px;
        }

        /* Tic Tac Toe Styles */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin-top: 15px;
        }

        .cell {
            background-color: #020617;
            border: 2px solid #475569;
            border-radius: 8px;
            font-size: 2.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            height: 100px;
            width: 100px;
        }

        .cell:hover {
            background-color: #0f172a;
        }

        .btn {
            margin-top: 15px;
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .score-board {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Logic Simulation Workspace</h1>
        <p>Client-side vanilla JavaScript canvas applications</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('snake')">Module A: Snake</button>
        <button class="tab-btn" onclick="switchTab('ttt')">Module B: Tic-Tac-Toe</button>
    </div>

    <!-- GAME 1: SNAKE -->
    <div id="snake-container" class="game-container active">
        <div class="score-board">Score: <span id="snakeScore">0</span></div>
        <canvas id="snakeCanvas" width="400" height="400"></canvas>
        <button class="btn" onclick="resetSnake()">Reset Session</button>
    </div>

    <!-- GAME 2: TIC TAC TOE -->
    <div id="ttt-container" class="game-container">
        <div id="tttStatus" class="score-board">Player X's turn</div>
        <div class="board">
            <div class="cell" onclick="makeMove(this, 0)"></div>
            <div class="cell" onclick="makeMove(this, 1)"></div>
            <div class="cell" onclick="makeMove(this, 2)"></div>
            <div class="cell" onclick="makeMove(this, 3)"></div>
            <div class="cell" onclick="makeMove(this, 4)"></div>
            <div class="cell" onclick="makeMove(this, 5)"></div>
            <div class="cell" onclick="makeMove(this, 6)"></div>
            <div class="cell" onclick="makeMove(this, 7)"></div>
            <div class="cell" onclick="makeMove(this, 8)"></div>
        </div>
        <button class="btn" onclick="resetTTT()">Clear Matrix</button>
    </div>

    <script>
        // Tab switching logic
        function switchTab(game) {
            document.querySelectorAll('.game-container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if(game === 'snake') {
                document.getElementById('snake-container').classList.add('active');
                event.target.classList.add('active');
                initSnake();
            } else {
                document.getElementById('ttt-container').classList.add('active');
                event.target.classList.add('active');
                clearInterval(snakeInterval);
            }
        }

        // ==========================================
        // SNAKE ENGINE CODE
        // ==========================================
        const canvas = document.getElementById("snakeCanvas");
        const ctx = canvas.getContext("2d");
        const grid = 20;
        let snake, count, apple, score, snakeInterval;
        let dX = grid, dY = 0;

        function initSnake() {
            clearInterval(snakeInterval);
            snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
            apple = {x: 300, y: 300};
            score = 0;
            dX = grid; dY = 0;
            document.getElementById('snakeScore').innerText = score;
            snakeInterval = setInterval(updateSnake, 100);
        }

        function updateSnake() {
            const head = {x: snake[0].x + dX, y: snake[0].y + dY};
            
            // Wall collision checks
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || collision(head)) {
                initSnake();
                return;
            }

            snake.unshift(head);
            if (head.x === apple.x && head.y === apple.y) {
                score += 10;
                document.getElementById('snakeScore').innerText = score;
                generateApple();
            } else {
                snake.pop();
            }

            // Draw Canvas Frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(apple.x, apple.y, grid - 2, grid - 2);
            ctx.fillStyle = '#38bdf8';
            snake.forEach(cell => ctx.fillRect(cell.x, cell.y, grid - 2, grid - 2));
        }

        function generateApple() {
            apple.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
            apple.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;
        }

        function collision(head) {
            return snake.some((cell, index) => index !== 0 && cell.x === head.x && cell.y === head.y);
        }

        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft" && dX === 0) { dX = -grid; dY = 0; }
            else if (e.key === "ArrowUp" && dY === 0) { dX = 0; dY = -grid; }
            else if (e.key === "ArrowRight" && dX === 0) { dX = grid; dY = 0; }
            else if (e.key === "ArrowDown" && dY === 0) { dX = 0; dY = grid; }
        });

        function resetSnake() { initSnake(); }

        // ==========================================
        // TIC TAC TOE ENGINE CODE
        // ==========================================
        let tttBoard = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let activeMatch = true;

        function makeMove(cell, index) {
            if (tttBoard[index] !== "" || !activeMatch) return;
            tttBoard[index] = currentPlayer;
            cell.innerText = currentPlayer;
            cell.style.color = currentPlayer === "X" ? "#38bdf8" : "#f43f5e";
            
            checkWin();
            if (activeMatch) {
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                document.getElementById("tttStatus").innerText = `Player ${currentPlayer}'s turn`;
            }
        }

        function checkWin() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            let won = wins.some(comb => tttBoard[comb[0]] && tttBoard[comb[0]] === tttBoard[comb[1]] && tttBoard[comb[0]] === tttBoard[comb[2]]);
            
            if (won) {
                document.getElementById("tttStatus").innerText = `Player ${currentPlayer} Wins!`;
                activeMatch = false;
            } else if (!tttBoard.includes("")) {
                document.getElementById("tttStatus").innerText = "Match is a Draw!";
                activeMatch = false;
            }
        }

        function resetTTT() {
            tttBoard = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            activeMatch = true;
            document.getElementById("tttStatus").innerText = "Player X's turn";
            document.querySelectorAll(".cell").forEach(c => c.innerText = "");
        }

        // Initialize default app on start
        initSnake();
    </script>
</body>
</html>
